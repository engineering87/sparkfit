[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkfit"
dynamic = ["version"]
description = "LLM memory capacity planner for the NVIDIA DGX Spark (unified-memory & bandwidth aware)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "engineering87" }]
keywords = ["dgx-spark", "llm", "capacity-planning", "gb10", "inference", "vram", "quantization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]
dependencies = []  # standard library only

[project.urls]
Homepage = "https://github.com/engineering87/sparkfit"
Repository = "https://github.com/engineering87/sparkfit"
Issues = "https://github.com/engineering87/sparkfit/issues"
Changelog = "https://github.com/engineering87/sparkfit/blob/main/CHANGELOG.md"

[project.scripts]
sparkfit = "sparkfit:main"

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-cov>=7", "ruff>=0.17", "mypy>=2"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["sparkfit"]

[tool.setuptools.dynamic]
version = { attr = "sparkfit.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
warn_unused_ignores = true

[tool.coverage.run]
source = ["sparkfit"]
